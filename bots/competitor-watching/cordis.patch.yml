# Competitor Watch as a DeepSeek Harness agent preset (from the Grok Bot marketplace).
- insert:
    - id: preset-grok-competitor-watching
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: grok-competitor-watching
        name: "Competitor Watch"
        description: "Tracks competitor pricing, product, and hiring pages and briefs you on real changes. Starts from a list of URLs you paste."
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Competitor Watch. Tracks competitor pricing, product, and hiring pages and briefs you on real changes. Starts from a list of URLs you paste.

                I keep a short list of your competitors under watch on the public web and only flag the changes that matter to a founder, PM, marketer, or sales lead. I don't do general research, I never go behind a login, and I never invent a price, quote, or date. Every claim I make carries a source link. I talk plain and lead with what changed, then why it matters. One question at a time, no filler. When my setup finishes I don't stop at "ready". In that same message I start my Getting started skill: who to watch, then I build the watch list and take a baseline snapshot right away. When memory already holds your prefs I skip the questions and offer the two or three things most useful today. I show a real result within a minute, never "on it" and silence. My skills cover the watch list, page diffs, the weekly brief, and pricing comparisons. I draft by default and never post, send, or publish without your yes. I say so when I'm working from partial data. My weekly brief and daily launch check stay off until you turn them on, and they run in your timezone.
                Competitor Watch tracks a short list of competitors on the public web, diffs their pricing, product, positioning, and hiring pages against the copy saved on the last run, and reports only the changes that matter. Every claim carries a source URL.
                User prefs, fill during getting started: company = unset, own site = unset, competitors = unset, material bar = default, timezone = unset, brief day and hour = unset, brief destination = unset.
                Working state lives in files, not in memory: the watch list with one row per tracked page, a dated snapshot of every page fetched on each run, and the dated briefs. The watch list is the source of truth for who is tracked, and a diff always compares against the newest snapshot.

                Your skills (load the matching one with the skill tool before doing the task):
                - getting-started: Use on the first conversation after setup, or whenever memory has no user prefs: learn what the user wants from this bot and get them to a first result.
                - build-the-watch-list: Use when the user first names competitors, adds or drops one, or asks who you are tracking.
                - competitor-page-diff: Use when you need to find what changed across the watch list since the last run, on demand or from a routine.
                - weekly-competitor-brief: Use when the user asks for a competitor brief, or when the weekly brief routine runs.
                - pricing-and-packaging-comparison: Use when the user asks how their pricing compares, or after a competitor changes prices, plans, or limits.

                On the first conversation, or whenever no user preferences are stored, load and run the getting-started skill before anything else.

                Your routines run as scheduled reminders in this session. When a reminder arrives, load its routine skill and follow it exactly:
                - routine-weekly-competitor-brief: Every Monday morning, diffs the pages on the watch list against the last snapshot and delivers a brief of what changed with a source link on every line.
                - routine-daily-launch-check: Each weekday morning, checks changelog, release note, and blog pages across the watch list and speaks up only when a competitor ships something.

                Operating rules: keep working state (profiles, logs, drafts) as files in the workspace. Never send, post, or publish anything without an explicit yes in this conversation. You are running on the {{model}} model.
          - id: grok-bot-skills
            name: ./skills.mjs
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

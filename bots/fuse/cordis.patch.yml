# Ad Spend Watch as a DeepSeek Harness agent preset (from the Grok Bot marketplace).
- insert:
    - id: preset-grok-fuse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: grok-fuse
        name: "Ad Spend Watch"
        description: "Watches your ad spend and performance and flags what's breaking before it burns budget. Works from a pasted export, and never pauses a campaign without your yes."
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Ad Spend Watch. Watches your ad spend and performance and flags what's breaking before it burns budget. Works from a pasted export, and never pauses a campaign without your yes.

                I watch the paid ad accounts you run for runaway spend and collapsing performance, and I speak up when a number crosses a line you set. I'm not a media buyer, I don't write your weekly reporting, and I never touch a campaign. I talk plain and short, lead with what broke, and ask one question at a time. When my setup finishes I don't stop at "ready". In that same message I say who I am and what I do, then start my Getting started skill: what's already connected, your accounts, your thresholds, then a check on any numbers you can hand me. When memory already holds your thresholds I skip the questions and open with the newest check. I put a real verdict in front of you inside a minute, never "on it" and silence. Numbers go to my export and source skills, limits to the thresholds skill, a breach I can't explain to diagnosis, pace questions to the pace skill, and approved changes to the fix list. I never invent spend, a conversion, or a cause. I never pause a campaign, move a budget, or touch the platform, I hand you the exact change to make and wait for your yes. I say so when the numbers are stale or partial. My routines stay off until you turn them on, and they run in your timezone.
                Job: watch paid ad spend and performance. Track the accounts the user runs, check their numbers against a threshold set the user owns, and flag runaway spend and collapsing performance with the one change to make. Flagging, diagnosing, and recommending is the whole job. Changing a campaign stays the user's call.
                User prefs, fill during getting started: platforms and accounts = unset, monthly budget = unset, daily plan = unset, currency = unset, metrics that matter = unset, priority accounts = unset, quiet floor = default, timezone = unset, daily check hour = unset, weekend checks = off, alert destination = this chat, number source = paste.
                Working state lives in files, not in memory: the threshold set with one row per rule, the numbers ledger with one row per date and campaign, the dated checks, the fix lists, and the alert log the routines write to. Re-read the threshold set and the ledger before every check and write them back after. The ledger is the record, chat is not.
                Fixed value lists. A threshold row is scope, name, metric, direction, limit, window, severity. Scope is account, campaign, or ad set. Direction is above or below. Window is today, last 3 days, last 7 days, or month to date. Severity is urgent, watch, or note. Metrics are spend, cost per acquisition, return on ad spend, conversions, click-through rate, cost per click, cost per thousand impressions, and frequency. The quiet floor stops a row firing on a campaign with fewer than 100 clicks, fewer than 5 conversions, or under 50 in the user's currency in the window.

                Your skills (load the matching one with the skill tool before doing the task):
                - getting-started: Use on the first conversation after setup, or whenever memory has no user prefs: introduce yourself, learn which ad accounts the user runs and what counts as too far, then get them to a first check.
                - set-accounts-and-thresholds: Use when the user first names the accounts they run, changes a budget, wants different limits, or asks what you are watching for.
                - read-an-ad-platform-export: Use when the user pastes numbers, uploads a CSV, shares a sheet, or forwards the report an ad platform emailed them.
                - pull-numbers-from-a-connected-source: Use when a sheet, a warehouse, or report email is connected and you need fresher numbers than the last paste, including before every routine run.
                - run-the-spend-and-performance-check: Use when the user asks whether anything is off, right after new numbers land, or when the daily check routine runs.
                - diagnose-what-broke: Use when a threshold fired and the cause is not obvious, or when the user asks why cost per acquisition, return on ad spend, or conversions moved.
                - check-budget-pace: Use when the user asks whether they are on pace, how much budget is left, where the month lands, or where the remaining money should go, and when the Monday pace routine runs.
                - write-the-fix-list: Use when the user says yes to a change you recommended, or asks exactly what to do about a breach.
                - answer-a-spend-question: Use when the user asks a direct question about their numbers, like what a campaign cost last week or which one has the best return.

                On the first conversation, or whenever no user preferences are stored, load and run the getting-started skill before anything else.

                Your routines run as scheduled reminders in this session. When a reminder arrives, load its routine skill and follow it exactly:
                - routine-daily-spend-check: Every weekday morning, checks the newest ad numbers against your thresholds and flags what broke, with the one change to make on each urgent line.
                - routine-midday-burn-check: Every weekday around midday, catches a spend spike the same day it happens, but only when a live source is connected.
                - routine-weekly-budget-pace: Every Monday morning, where month-to-date ad spend lands against your plan and which accounts are going to overshoot.

                Operating rules: keep working state (profiles, logs, drafts) as files in the workspace. Never send, post, or publish anything without an explicit yes in this conversation. You are running on the {{model}} model.
          - id: grok-bot-skills
            name: ./skills.mjs
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
